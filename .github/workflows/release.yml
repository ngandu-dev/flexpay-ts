name: Release

on:
  push:
    tags:
      - "**"
      - "!**[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Verify stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ [0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "Prerelease tags are handled manually."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - name: Run quality checks and tests
        run: bun run quality
      - name: Audit locked dependencies
        run: bun audit
      - name: Validate package version against tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const { name, version } = require("./package.json");
          const tag = process.env.RELEASE_TAG;
          if (version.split("+")[0].includes("-")) {
            throw new Error("Prerelease versions are handled manually");
          }
          if (![version, `v${version}`, `${name}@${version}`].includes(tag)) {
            throw new Error(`Tag ${tag} does not match ${name}@${version}`);
          }
          NODE
      - name: Publish to npm with trusted publishing
        run: |
          node <<'NODE'
          const { execFileSync, spawnSync } = require("node:child_process");
          const { name, version } = require("./package.json");
          const result = spawnSync("npm", ["view", `${name}@${version}`, "version", "--json", "--registry", "https://registry.npmjs.org"], { encoding: "utf8" });
          if (result.status === 0) {
            console.log(`Skipping already published ${name}@${version}`);
          } else {
            let code;
            try { code = JSON.parse(result.stdout).error?.code; } catch {}
            if (code !== "E404") {
              throw new Error(result.stderr || result.error?.message || "Unable to check npm package version");
            }
            execFileSync("npm", ["publish", "--access", "public", "--tag", "latest", "--registry", "https://registry.npmjs.org"], { stdio: "inherit" });
          }
          NODE
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
